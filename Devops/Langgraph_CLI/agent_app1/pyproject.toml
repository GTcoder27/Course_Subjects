[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "create_agent"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
"langgraph",
"langchain",
"langchain-google-genai",
"python-dotenv"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"



